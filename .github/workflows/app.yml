name: Build MiTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle ko setup karega aur wrapper ka masla bypass karega
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper # Ye khud hi sahi version dhoond lega

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK (Force Build)
        run: |
          # Yahan hum './gradlew' use nahi kar rahe kyunke aapki repo wali file kharab hai
          # Hum direct 'gradle' command use kar rahe hain jo GitHub provide karta hai
          gradle assembleDebug --stacktrace -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiTV-App-Package
          path: "**/build/outputs/apk/debug/*.apk"
