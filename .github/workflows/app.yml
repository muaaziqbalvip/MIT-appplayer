name: Build MiTV Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Taake aap manually bhi chala saken

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Code ko GitHub runner mein lana
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Latest JDK 21 install karna (SDK 35 ke liye zaroori hai)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Broken Gradle Wrapper ko fix karna (Sab se aham step)
      - name: Regenerate Gradle Wrapper
        run: |
          # Agar aapki repo mein wrapper kharab hai, to ye usay naya bana dega
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # 4. Android SDK Licenses accept karna
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # 5. APK Build karna (Har kism ke error bypass flags ke sath)
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Pandroid.suppressUnsupportedCompileSdk=35 \
            -Pandroid.testInstrumentationRunnerArguments.package=com.mitv.network

      # 6. APK file ko download ke liye save karna
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiTV-Final-Build
          # Ye path har kism ke folder structure mein APK dhoond lega
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
