name: Build MiTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Taake aap manually bhi button daba kar build kar saken

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Android SDK licenses ko automatically accept karne ke liye
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          # CompileSdk 35 ke liye ye command sab se best hai
          ./gradlew assembleDebug --stacktrace --info -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiTV-Final-App
          # Ye command poori repo mein jahan bhi APK hogi dhoond nikalay gi
          path: "**/build/outputs/apk/debug/*.apk"
