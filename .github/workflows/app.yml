####################################################################################################
# MITV NETWORK - TITANIUM GRADE AUTO-HEALING & DIAGNOSTIC WORKFLOW
# Created for: Muaaz Iqbal (Founder, MiTV Network)
# Purpose: Total Project Coverage. Fixes missing files, memory issues, Firebase configs, 
# bypasses strict linting, renames invalid resources, and generates detailed crash logs.
####################################################################################################

name: MiTV Titanium Build & Auto-Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  titanium-build:
    name: Ultimate Fix, Build & Log
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ====================================================================================
      # STEP 1: MEMORY BOOST (PREVENT GRADLE OUT-OF-MEMORY CRASHES)
      # ====================================================================================
      - name: 🚀 Boost Runner Memory (Swap Space)
        run: |
          echo "Setting up extra memory for heavy Gradle build..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ====================================================================================
      # STEP 2: SOURCE CODE CHECKOUT
      # ====================================================================================
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ====================================================================================
      # STEP 3: JDK 21 SETUP
      # ====================================================================================
      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ====================================================================================
      # STEP 4: SMART PROJECT LOCATOR
      # ====================================================================================
      - name: 🕵️ Locate Root Directory
        id: locate
        run: |
          PROJECT_ROOT="."
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            for dir in $(find . -type d -name "app" | grep -v "/build/"); do
              PARENT=$(dirname "$dir")
              if [ -f "$PARENT/build.gradle" ] || [ -f "$PARENT/build.gradle.kts" ]; then
                PROJECT_ROOT="$PARENT"
                break
              fi
            done
          fi
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_ROOT"

      # ====================================================================================
      # STEP 5: GRADLE WRAPPER REPAIR
      # ====================================================================================
      - name: 🛠️ Repair Gradle Wrapper
        run: |
          cd "${{ env.project_root }}"
          rm -rf gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # ====================================================================================
      # STEP 6: EXTREME GRADLE CONFIGURATION (BYPASS ERRORS)
      # ====================================================================================
      - name: ⚙️ Auto-Configure gradle.properties
        run: |
          cd "${{ env.project_root }}"
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          android.lintOptions.abortOnError=false
          EOF
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ====================================================================================
      # STEP 7: MOCK FIREBASE CONFIG (GOOGLE-SERVICES.JSON)
      # ====================================================================================
      # Agar Firebase ki file missing hai to plugin crash kar deta hai. Ye usay bachayega.
      - name: 🔥 Generate Mock google-services.json
        run: |
          cd "${{ env.project_root }}"
          if [ -d "app" ] && [ ! -f "app/google-services.json" ]; then
            echo "google-services.json not found! Generating a mock file to prevent crashes..."
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789012",
                "project_id": "mitv-mock-project"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                    "android_client_info": {
                      "package_name": "com.mitv.network"
                    }
                  },
                  "api_key": [ { "current_key": "MOCK_API_KEY_FOR_BUILD_ONLY" } ]
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      # ====================================================================================
      # STEP 8: AUTO-FIX INVALID RESOURCES
      # ====================================================================================
      - name: 🧹 Sanitize Resource Names
        run: |
          cd "${{ env.project_root }}"
          if [ -d "app/src/main/res" ]; then
            find app/src/main/res -type f | while read f; do
              dir=$(dirname "$f")
              base=$(basename "$f")
              sanitized=$(echo "$base" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr '-' '_')
              if [ "$base" != "$sanitized" ]; then
                mv "$f" "$dir/$sanitized"
              fi
            done
          fi

      # ====================================================================================
      # STEP 9: THE BUILD COMMAND (WITH FULL LOGGING)
      # ====================================================================================
      - name: 🏗️ Compile and Build APK
        id: build_step
        run: |
          cd "${{ env.project_root }}"
          echo "Starting heavy compilation..."
          # --continue flag means it will try to build even if some non-critical tasks fail
          ./gradlew clean assembleDebug --stacktrace --info --continue > build_log.txt 2>&1
          
          # Check if build actually generated an APK
          APK_COUNT=$(find . -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Build failed to produce an APK. Check the logs."
            exit 1
          fi

      # ====================================================================================
      # STEP 10: ARTIFACT UPLOADS (APK OR LOGS)
      # ====================================================================================
      - name: 🚀 Upload Successful APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiTV-Titanium-APK
          path: "**/*.apk"

      - name: 🚨 UPLOAD CRASH LOGS (IF FAILED)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MiTV-Detailed-Crash-Log
          path: "**/build_log.txt"
